[project]
name = "geniusai-server"
version = "5.0.0"
description = "Backend server for LrGeniusAI."
requires-python = ">=3.12"
dependencies = [
  "flask",
  "fastmcp",
  "fastapi",
  "a2wsgi",
  "uvicorn",
  "google-genai",
  "lmstudio",
  "numpy",
  "ollama",
  "openai",
  "pillow",
  "psycopg[binary]",
  "pyinstaller",
  "rawpy",
  "requests",
  "torch",
  "transformers>=4.57.6",
]

[tool.uv]
python-preference = "only-system"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
